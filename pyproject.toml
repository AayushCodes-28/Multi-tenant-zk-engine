[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-tenant-zk-engine"
version = "2.0.0"
description = "Privacy-preserving multi-tenant search and encrypted aggregation demo"
requires-python = ">=3.11"
dependencies = [
  "streamlit==1.49.1",
  "pycryptodome==3.23.0",
  "phe==1.5.0",
  "fastapi==0.143.0",
  "uvicorn==0.54.0",
  "httpx==0.28.1"
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["src*"]

